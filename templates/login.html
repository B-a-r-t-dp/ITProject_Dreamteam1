<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Eigen CSS -->
    <!-- Dynamisch CSS-bestand laden -> Jinja2 regel -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-light">

<!-- Loginformulier container -->
<div class="container mt-5">

    <!-- Loginkaart -->
    <div class="card mx-auto">
        <div class="card-body">

            <!-- Titel -->
            <h3 class="mb-4 text-center">Login Docent</h3>

            <!-- Foutmelding tonen indien aanwezig, 
             Dit is Jinja2-syntax (de template-engine van Flask). -->
            {% if error %}

                <!-- Bootstrap foutmelding -->
                <div class="alert alert-danger">
                    
                    <!-- Foutmelding uit Flask weergeven -->
                    {{ error }}
                </div>
            {% endif %}

            <!-- Loginformulier -->
            <form method="POST">

                <!-- Gebruikersnaam -->
                <div class="mb-3">
                    <label class="form-label">Gebruikersnaam</label>
                    <input type="text" name="username" class="form-control" required>
                </div>

                <!-- Wachtwoord -->
                <div class="mb-3">
                    <label class="form-label">Wachtwoord</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <!-- Loginknop -->
                <button class="btn btn-primary w-100">Login</button>
            </form>

        </div>
    </div>
</div>

</body>
</html>
