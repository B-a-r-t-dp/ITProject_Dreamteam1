# Eigenaar: Bart
# Doel:
# - basisconfiguratie voor FTP-container
# - lokale FTP-gebruiker laten aanmelden
# - testbestand beschikbaar maken via FTP

listen=YES
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
xferlog_enable=YES
connect_from_port_20=YES
chroot_local_user=YES
allow_writeable_chroot=YES
seccomp_sandbox=NO
