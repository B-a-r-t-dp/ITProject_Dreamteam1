# Eigenaar: Bart
# Doel:
# - nginx-configuratie voor HTTPS-container
# - self-signed certificaat gebruiken
# - indexpagina aanbieden op poort 443

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    root /usr/share/nginx/html;
    index index.html;
}
