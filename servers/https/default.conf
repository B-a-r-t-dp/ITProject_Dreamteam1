# HTTPS nginx-configuratie
# Verantwoordelijke: Bart
#
# Deze configuratie zegt tegen nginx:
# - luister op poort 443
# - gebruik SSL/TLS
# - gebruik het self-signed certificaat uit /etc/nginx/certs
# - toon bestanden uit /usr/share/nginx/html
# - gebruik index.html als startpagina

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    root /usr/share/nginx/html;
    index index.html;
}
