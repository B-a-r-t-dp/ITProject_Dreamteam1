# Algemene Ansible-inventory
# Verantwoordelijke: Bart
#
# Dit bestand is een fallback/voorbeeld.
# Voor echte netwerkopstellingen gebruiken we liever een inventory per setup:
#
# - ansible/playbooks/setup1/inventory.ini
# - ansible/playbooks/setup2/inventory.ini
#
# Zo kan elke opstelling eigen management-IP's, logins en toestellen gebruiken.

[routers]
r1 ansible_host=192.168.0.215

[switches]
sw1 ansible_host=192.168.0.216

[network_devices:children]
routers
switches

[network_devices:vars]
ansible_connection=network_cli
ansible_network_os=cisco.ios.ios

# Voorbeeldlogin.
# Pas deze waarden aan in de inventory van de specifieke setup.
ansible_user=admin
ansible_password=azerty
ansible_become=yes
ansible_become_method=enable
ansible_become_password=azerty

# Nodig voor oudere Cisco/EVE-NG images.
ansible_ssh_common_args=-oKexAlgorithms=+diffie-hellman-group-exchange-sha1,diffie-hellman-group1-sha1,diffie-hellman-group14-sha1 -oHostKeyAlgorithms=+ssh-rsa -oPubkeyAcceptedAlgorithms=+ssh-rsa

ansible_command_timeout=120
ansible_connect_timeout=30