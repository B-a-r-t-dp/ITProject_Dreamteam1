setup_name: Podopstelling Brussel
description: 1 pod met router, 2 pod-switches, distributieswitch en classroomswitch

# variables bevat de technische waarden die de setup2-playbooks gebruiken.

###############################################################################
#                              Setupvariabelen                                #
###############################################################################


variables:
  # Router-on-a-stick.
  # De router gebruikt 1 fysieke trunkinterface met subinterfaces per VLAN.
  router:
    hostname: R1
    management_ip: 192.168.0.221

    trunk_interface: GigabitEthernet0/0
    trunk_interface_short: Gi0/0
    trunk_description: Trunk naar SW11 voor VLAN 10, VLAN 20, VLAN 30 en VLAN 40

    subinterfaces:
      - vlan: 10
        description: Gateway VLAN 10 DOCENTEN
        ip: 192.168.10.1
        mask: 255.255.255.0
      - vlan: 20
        description: Gateway VLAN 20 STUDENTEN
        ip: 192.168.20.1
        mask: 255.255.255.0
      - vlan: 30
        description: Gateway VLAN 30 SERVERS
        ip: 192.168.30.1
        mask: 255.255.255.0
      - vlan: 40
        description: Gateway VLAN 40 GASTEN
        ip: 192.168.40.1
        mask: 255.255.255.0

  # VLANs die doorheen de volledige podopstelling gebruikt worden.
  vlans:
    - id: 10
      name: DOCENTEN
    - id: 20
      name: STUDENTEN
    - id: 30
      name: SERVERS
    - id: 40
      name: GASTEN

  # Switchdata per switch.
  # De sleutelnaam, bijvoorbeeld sw11, moet overeenkomen met de naam in inventory.ini.
  switches:
    trunk_allowed_vlans: "10,20,30,40"

    # Eerste podswitch.
    # Deze switch hangt rechtstreeks aan de router.
    sw11:
      hostname: SW11
      management_ip: 192.168.0.222
      trunk_ports:
        - interface: GigabitEthernet0/1
          description: Trunk naar R1
        - interface: GigabitEthernet0/2
          description: Trunk naar SW12

    # Tweede podswitch.
    # Deze switch vormt de verbinding richting de distributieswitch.
    sw12:
      hostname: SW12
      management_ip: 192.168.0.223
      trunk_ports:
        - interface: GigabitEthernet0/1
          description: Trunk naar SW11
        - interface: GigabitEthernet0/2
          description: Trunk naar DISTSW

    # Distributieswitch aan de pod/serverruimte-kant.
    # Deze switch maakt de EtherChannel richting de classroomswitch.
    distsw:
      hostname: DISTSW
      management_ip: 192.168.0.224
      trunk_ports:
        - interface: GigabitEthernet0/1
          description: Trunk naar SW12
      etherchannel:
        port_channel: 1
        mode: active
        member_ports:
          - interface: GigabitEthernet0/2
            description: EtherChannel naar CLASSSW link 1
          - interface: GigabitEthernet0/3
            description: EtherChannel naar CLASSSW link 2

    # Classroomswitch aan de studentenkant.
    # Hier komen de voorbeeld-accesspoorten terecht.
    classsw:
      hostname: CLASSSW
      management_ip: 192.168.0.225
      etherchannel:
        port_channel: 1
        mode: active
        member_ports:
          - interface: GigabitEthernet0/1
            description: EtherChannel naar DISTSW link 1
          - interface: GigabitEthernet0/2
            description: EtherChannel naar DISTSW link 2
      access_ports:
          - interface: GigabitEthernet0/3
            description: Docentenpoort VLAN 10
            vlan: 10
          - interface: GigabitEthernet1/0
            description: Studentenpoort VLAN 20
            vlan: 20
          - interface: GigabitEthernet1/1
            description: Serverpoort VLAN 30
            vlan: 30
          - interface: GigabitEthernet1/2
            description: Gastpoort VLAN 40
            vlan: 40

###############################################################################
#                         Technische documentatie frontend                     #
###############################################################################

# technical_documentation wordt enkel gebruikt door de frontend.
# Dit is gewone tekst voor de docent/student.
# Deze tekst legt uit hoe de setup aangesloten wordt en wat ze configureert.
technical_documentation:
  title: Technische documentatie
  intro: Deze setup configureert 1 pod uit het labo in Brussel. Het doel is dat de VLANs vanuit de pod via de distributieswitch tot aan de classroomswitch beschikbaar worden gemaakt.
  sections:
    - title: Management-IP's voor ssh
      items:
        - R1 gebruikt management-IP 192.168.0.221.
        - SW11 gebruikt management-IP 192.168.0.222.
        - SW12 gebruikt management-IP 192.168.0.223.
        - DISTSW gebruikt management-IP 192.168.0.224.
        - CLASSSW gebruikt management-IP 192.168.0.225.

    - title: Labo-aansluitingen
      items:
        - R1 Gi0/0 -> SW11 Gi0/1.
        - SW11 Gi0/2 -> SW12 Gi0/1.
        - SW12 Gi0/2 -> DISTSW Gi0/1.
        - DISTSW Gi0/2 -> CLASSSW Gi0/1.
        - DISTSW Gi0/3 -> CLASSSW Gi0/2.
        - CLASSSW Gi0/3, Gi1/0, Gi1/1 en Gi1/2 zijn voorbeeldpoorten aan de classroomkant.
        - In de fysieke labo-opstelling gaat het over meerdere classroompoorten. In EVE-NG gebruiken we de beschikbare vIOS L2-poorten, omdat deze switch geen Gi0/4, Gi0/5 en Gi0/6 heeft.

    - title: Wat configureert de setup?
      items:
        - R1 wordt ingesteld als router-on-a-stick. De router krijgt subinterfaces voor VLAN 10, 20, 30 en 40.
        - Alle switches krijgen dezelfde VLANs, zodat die VLANs doorheen de volledige podopstelling gebruikt kunnen worden.
        - SW11 en SW12 verbinden de router en de podkant met de distributieswitch.
        - DISTSW en CLASSSW worden via 2 fysieke links gekoppeld. Die 2 links worden samengevoegd in 1 EtherChannel trunk.
        - CLASSSW krijgt accesspoorten voor de classroomkant, bijvoorbeeld docenten, studenten, servers en gasten.
        - Kort gezegd: deze setup zorgt dat VLANs uit de pod tot in het klaslokaal beschikbaar zijn.

