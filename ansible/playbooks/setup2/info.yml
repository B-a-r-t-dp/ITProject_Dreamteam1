setup_name: Podopstelling Brussel
description: 1 pod met router, 2 pod-switches, distributieswitch en classroomswitch

# variables bevat de technische waarden die de setup2-playbooks gebruiken.
# Deze opstelling stelt 1 werkende pod voor uit het grotere labo-podmodel.
# De andere pods kunnen later hetzelfde principe volgen.

variables:
  router:
    hostname: R1
    management_ip: 192.168.0.221

    trunk_interface: GigabitEthernet0/0
    trunk_interface_short: Gi0/0
    trunk_description: Trunk naar SW11 voor VLAN 10 en VLAN 20,VLAN 30 en VLAN 40

    subinterfaces:
      - vlan: 10
        description: Gateway VLAN 10 DOCENTEN
        ip: 192.168.10.1
        mask: 255.255.255.0
      - vlan: 20
        description: Gateway VLAN 20 STUDENTEN
        ip: 192.168.20.1
        mask: 255.255.255.0
      - vlan: 30
        description: Gateway VLAN 30 SERVERS
        ip: 192.168.30.1
        mask: 255.255.255.0
      - vlan: 40
        description: Gateway VLAN 40 GASTEN
        ip: 192.168.40.1
        mask: 255.255.255.0

  vlans:
    - id: 10
      name: DOCENTEN
    - id: 20
      name: STUDENTEN
    - id: 30
      name: SERVERS
    - id: 40
      name: GASTEN

  switches:
    trunk_allowed_vlans: "10,20,30,40"

    sw11:
      hostname: SW11
      management_ip: 192.168.0.222
      trunk_ports:
        - interface: GigabitEthernet0/1
          description: Trunk naar R1
        - interface: GigabitEthernet0/2
          description: Trunk naar SW12

    sw12:
      hostname: SW12
      management_ip: 192.168.0.223
      trunk_ports:
        - interface: GigabitEthernet0/1
          description: Trunk naar SW11
        - interface: GigabitEthernet0/2
          description: Trunk naar DISTSW

    distsw:
      hostname: DISTSW
      management_ip: 192.168.0.224
      trunk_ports:
        - interface: GigabitEthernet0/1
          description: Trunk naar SW12
      etherchannel:
        port_channel: 1
        mode: active
        member_ports:
          - interface: GigabitEthernet0/2
            description: EtherChannel naar CLASSSW link 1
          - interface: GigabitEthernet0/3
            description: EtherChannel naar CLASSSW link 2

    classsw:
      hostname: CLASSSW
      management_ip: 192.168.0.225
      etherchannel:
        port_channel: 1
        mode: active
        member_ports:
          - interface: GigabitEthernet0/1
            description: EtherChannel naar DISTSW link 1
          - interface: GigabitEthernet0/2
            description: EtherChannel naar DISTSW link 2
      access_ports:
          - interface: GigabitEthernet0/3
            description: Docentenpoort VLAN 10
            vlan: 10
          - interface: GigabitEthernet0/4
            description: Studentenpoort VLAN 20
            vlan: 20
          - interface: GigabitEthernet0/5
            description: Serverpoort VLAN 30
            vlan: 30
          - interface: GigabitEthernet0/6
            description: Gastpoort VLAN 40
            vlan: 40
# technical_documentation wordt enkel gebruikt door de frontend.
# Dit is gewone tekst voor de docent/student.
technical_documentation:
  title: Technische documentatie
  intro: Deze info toont hoe 1 pod uit het labo in Brussel aangesloten en geconfigureerd wordt.
  sections:
    - title: Management-IP's voor ssh
      items:
        - R1 gebruikt management-IP 192.168.0.221.
        - SW11 gebruikt management-IP 192.168.0.222.
        - SW12 gebruikt management-IP 192.168.0.223.
        - DISTSW gebruikt management-IP 192.168.0.224.
        - CLASSSW gebruikt management-IP 192.168.0.225.

    - title: Labo-aansluitingen
      items:
        - R1 Gi0/0 -> SW11 Gi0/1.
        - SW11 Gi0/2 -> SW12 Gi0/1.
        - SW12 Gi0/2 -> DISTSW Gi0/1.
        - DISTSW Gi0/2 -> CLASSSW Gi0/1.
        - DISTSW Gi0/3 -> CLASSSW Gi0/2.
        - CLASSSW Gi0/3 is de studentpoort op VLAN 10.

    - title: Wat configureert de setup?
      items:
        - R1 krijgt subinterfaces voor VLAN 10 en VLAN 20.
        - De switches krijgen VLAN 10 DOCENTEN en VLAN 20 STUDENTEN.
        - De links tussen DISTSW en CLASSSW worden als EtherChannel trunk ingesteld.
        - CLASSSW krijgt een accesspoort voor de studentenkant.

