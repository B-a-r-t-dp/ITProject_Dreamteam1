setup_name: Basisopstelling
description: 1 router, 1 switch, HTTP, HTTPS en FTP

# variables bevat de technische waarden die de playbooks gebruiken.
# Zo staan de waarden van deze opstelling op 1 centrale plaats.
#
# Voordeel:
# - de frontend toont dezelfde info en kan ook in frontend aangepast worden;
# - Ansible gebruikt dezelfde waarden om te configureren;

###############################################################################
#                              Setupvariabelen                                #
###############################################################################

# Belangrijk:
# - de frontend toont en wijzigt deze waarden;
# - Ansible gebruikt dezelfde waarden om de toestellen en containers te configureren;
# - zo vermijden we dat het dashboard iets anders toont dan het playbook doet.

variables:
  # Router van de basisopstelling.
  # Deze router krijgt 1 labinterface en een eenvoudige OSPF-configuratie.
  router:
    hostname: R1
    management_ip: 192.168.0.215

    lab_interface: GigabitEthernet0/1
    lab_interface_short: Gi0/1
    lab_description: Link naar LAN of switch
    lab_ip: 192.168.10.1
    lab_prefix: 24
    lab_mask: 255.255.255.0

    ospf_process: 1
    ospf_router_id: 1.1.1.1
    ospf_network: 192.168.10.0
    ospf_wildcard: 0.0.0.255
    ospf_area: 0

  # Switch van de basisopstelling.
  # Deze switch krijgt VLANs, 1 accesspoort en 1 trunkpoort.
  switch:
    hostname: SW1
    management_ip: 192.168.0.216

    vlans:
      - id: 10
        name: DOCENTEN
      - id: 20
        name: STUDENTEN

    access_port: GigabitEthernet0/2
    access_port_short: Gi0/2
    access_description: Accesspoort VLAN 10
    access_vlan: 10

    trunk_port: GigabitEthernet0/3
    trunk_port_short: Gi0/3
    trunk_description: Trunk naar router of uplink
    trunk_allowed_vlans: "10,20"

  # Servercontainers die bij setup1 horen.
  # Deze waarden worden gebruikt door servers.yml om containers te starten en te testen.
  servers:
    http:
      service: http
      scheme: http
      port: 80
      description: nginx op poort 80

    https:
      service: https
      scheme: https
      port: 443
      certificate: self-signed
      description: nginx + self-signed certificaat op poort 443

    ftp:
      service: ftp
      ports: "20/21 en passive 30000-30010"
      control_port: 21
      passive_ports: "30000-30010"
      user: ftpuser
      password: itproject
      test_directory: ftp
      test_file: test.txt
      description: vsftpd op poort 20/21 met testbestand
      
###############################################################################
#                         Technische documentatie frontend                     #
###############################################################################

# technical_documentation wordt enkel gebruikt door de frontend.
# Dit is gewone tekst voor de docent/student.
# Deze tekst legt uit hoe de setup aangesloten wordt en wat ze configureert.
technical_documentation:
  title: Technische documentatie
  intro: Deze info toont welke toestellen, management-IP's en poorten bij setup1 horen.
  sections:
    - title: Management-IP's
      items:
        - R1 gebruikt management-IP 192.168.0.215.
        - SW1 gebruikt management-IP 192.168.0.216.
        - Deze IP's worden door Ansible gebruikt om via SSH te verbinden.

    - title: Verwachte aansluitingen
      items:
        - R1 Gi0/0 is de managementinterface voor SSH en Ansible.
        - R1 Gi0/1 wordt gebruikt als labinterface richting de switch.
        - SW1 Gi0/2 is de accesspoort voor VLAN 10.
        - SW1 Gi0/3 is de trunkpoort voor VLAN 10 en VLAN 20.

    - title: Wat configureert de setup?
      items:
        - Router R1 krijgt een lab-IP 192.168.10.1/24 op Gi0/1.
        - Switch SW1 krijgt VLAN 10 DOCENTEN en VLAN 20 STUDENTEN.
        - HTTP draait op poort 80, HTTPS op poort 443 en FTP op poort 21.
