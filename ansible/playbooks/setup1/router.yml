---
# Routerplaybook
# Verantwoordelijke: Bart
#
# Dit playbook bevat de basisconfiguratie voor de router uit onze MVP.
#
# Voor Sprint 1 bereiden we dit al zo voor dat het later testbaar is in EVE-NG.
# De exacte IP-adressen en interfacenamen kunnen nog aangepast worden
# aan de definitieve topologie.

- name: Router basisconfiguratie voorbereiden
  hosts: routers
  gather_facts: false

  tasks:
    # Deze debug-taak verandert nog niets op de router.
    # Ze helpt ons controleren welke router Ansible geselecteerd heeft.
    - name: Controleer welke router gebruikt wordt
      ansible.builtin.debug:
        msg: "Router {{ inventory_hostname }} gebruikt IP {{ ansible_host }}"

    # Stelt de hostname van de router in.
    # Zo is de router in de CLI herkenbaar als R1.
    - name: Hostname instellen
      cisco.ios.ios_config:
        lines:
          - hostname R1

    # Configureert een labinterface voor de MVP.
    # GigabitEthernet0/0 blijft de managementinterface voor SSH/Ansible.
    # Daarom gebruiken we hier GigabitEthernet0/1 voor de laboconfiguratie.
    - name: Labinterface configureren
      cisco.ios.ios_config:
        parents:
          - interface GigabitEthernet0/1
        lines:
          - description Link naar LAN of switch
          - no ip address
          - ip address 192.168.10.1 255.255.255.0
          - no shutdown

    # Voorziet een eenvoudige OSPF-basis.
    # OSPF wordt later gebruikt om routes tussen netwerken uit te wisselen.
    - name: OSPF-basisconfiguratie instellen
      cisco.ios.ios_config:
        parents:
          - router ospf 1
        lines:
          - router-id 1.1.1.1
          - network 192.168.10.0 0.0.0.255 area 0

    # Slaat de configuratie op als er iets gewijzigd is.
    # Zo blijft de configuratie behouden na een herstart van de router.
    - name: Configuratie opslaan indien gewijzigd
      cisco.ios.ios_config:
        save_when: modified
