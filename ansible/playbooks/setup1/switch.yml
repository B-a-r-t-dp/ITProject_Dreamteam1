---
# Switchplaybook
# Verantwoordelijke: Bart
#
# Dit playbook bevat de basisconfiguratie voor de switch uit onze MVP.
#
# De technische waarden komen uit info.yml.
# Daardoor staan VLANs, poorten en hostnames op 1 centrale plaats
# per opstelling.

- name: Switch basisconfiguratie voorbereiden
  hosts: switches
  gather_facts: false

  vars_files:
    - info.yml

  tasks:
    # Deze debug-taak verandert niets op de switch.
    # Ze helpt controleren welke switch Ansible geselecteerd heeft.
    - name: Controleer welke switch gebruikt wordt
      ansible.builtin.debug:
        msg: "Switch {{ inventory_hostname }} gebruikt IP {{ ansible_host }}"

    # Stelt de hostname van de switch in.
    # De waarde komt uit info.yml.
    - name: Hostname instellen
      cisco.ios.ios_config:
        lines:
          - "hostname {{ variables.switch.hostname }}"

    # Maakt alle VLANs aan die in info.yml staan.
    # Daardoor kunnen we later VLANs toevoegen zonder deze taak te herschrijven.
    - name: VLANs aanmaken
      cisco.ios.ios_config:
        parents:
          - "vlan {{ item.id }}"
        lines:
          - "name {{ item.name }}"
      loop: "{{ variables.switch.vlans }}"

    # Zet de accesspoort eerst terug naar standaardconfiguratie.
    #
    # Dit vermijdt dat oude testconfiguratie blijft hangen.
    # Daarna bouwen we de gewenste accesspoort opnieuw proper op.
    - name: Accesspoort resetten
      cisco.ios.ios_config:
        lines:
          - "default interface {{ variables.switch.access_port }}"

    # Configureert de accesspoort.
    # De poort en VLAN komen uit info.yml.
    - name: Accesspoort configureren
      cisco.ios.ios_config:
        parents:
          - "interface {{ variables.switch.access_port }}"
        lines:
          - "description {{ variables.switch.access_description }}"
          - switchport mode access
          - "switchport access vlan {{ variables.switch.access_vlan }}"
          - no shutdown

    # Zet de trunkpoort eerst terug naar standaardconfiguratie.
    #
    # Zo vermijden we dat oude accessconfiguratie of testregels
    # blijven staan op een poort die als trunk bedoeld is.
    - name: Trunkpoort resetten
      cisco.ios.ios_config:
        lines:
          - "default interface {{ variables.switch.trunk_port }}"

    # Configureert de trunkpoort.
    # De poort en toegelaten VLANs komen uit info.yml.
    - name: Trunkpoort configureren
      cisco.ios.ios_config:
        parents:
          - "interface {{ variables.switch.trunk_port }}"
        lines:
          - "description {{ variables.switch.trunk_description }}"
          - switchport trunk encapsulation dot1q
          - switchport mode trunk
          - "switchport trunk allowed vlan {{ variables.switch.trunk_allowed_vlans }}"
          - no shutdown

    # Slaat de configuratie op als er iets gewijzigd is.
    # Zo blijft de configuratie behouden na een herstart van de switch.
    - name: Configuratie opslaan indien gewijzigd
      cisco.ios.ios_config:
        save_when: modified

    # Maakt metadata voor de backupbestandsnaam.
    #
    # backup_timestamp:
    # - zorgt dat elke backup een uniek tijdstip krijgt.
    #
    # backup_created_by:
    # - kan later vanuit Flask meegegeven worden als docentnaam.
    # - zolang dat nog niet gekoppeld is, gebruiken we "unknown".
    - name: Backupmetadata voorbereiden
      ansible.builtin.set_fact:
        backup_timestamp: "{{ lookup('pipe', 'TZ=Europe/Brussels date +%Y%m%d-%H%M%S') }}"
        backup_created_by: "{{ logged_user | default('unknown') }}"

    # Haalt de volledige running-config van de switch op.
    # Dit gebruiken we als eenvoudige backup voor de MVP.
    - name: Switch running-config ophalen voor backup
      cisco.ios.ios_command:
        commands:
          - show running-config
      register: switch_backup_config

    # Bewaart de switchconfiguratie als tekstbestand in /app/backups.
    #
    # /app/backups is via Docker Compose gekoppeld aan de map backups/
    # op onze eigen pc. Daardoor blijft de backup zichtbaar buiten de container.
    #
    # De bestandsnaam bevat:
    # - het toestel uit de inventory;
    # - de gebruiker/docent als die later wordt meegegeven;
    # - de datum en tijd van de backup.
    - name: Switchconfiguratie bewaren in backups-map
      ansible.builtin.copy:
        content: "{{ switch_backup_config.stdout[0] }}"
        dest: "/app/backups/{{ inventory_hostname }}-{{ backup_created_by }}-{{ backup_timestamp }}-running-config.txt"
      delegate_to: localhost
