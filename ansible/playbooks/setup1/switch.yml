---
# Switchplaybook
# Verantwoordelijke: Bart
#
# Dit playbook bevat de basisconfiguratie voor de switch uit onze MVP.
#
# De technische waarden komen uit info.yml.
# Daardoor staan VLANs, poorten en hostnames op 1 centrale plaats
# per opstelling.


###############################################################################
#                            Algemene configuratie                            #
###############################################################################


- name: Switch basisconfiguratie voorbereiden
  hosts: switches                                                                               # Dit playbook wordt uitgevoerd op alle toestellen uit de groep switches.
  gather_facts: false                                                                           # We halen geen algemene systeeminformatie op, want voor Cisco-configuratie hebben we dat hier niet nodig.

  vars_files:
    - info.yml                                                                                  # De technische waarden komen uit info.yml.

  tasks:
    - name: Controleer welke switch gebruikt wordt
      ansible.builtin.debug:                                                                    # Toont een korte controlemelding in de Ansible-output.
        msg: "Switch {{ inventory_hostname }} gebruikt IP {{ ansible_host }}"

    - name: Hostname instellen
      cisco.ios.ios_config:                                                                     # Cisco-module waarmee Ansible configuratiecommando's naar IOS stuurt.
        lines:
          - "hostname {{ variables.switch.hostname }}"

    - name: VLANs aanmaken
      cisco.ios.ios_config:                                                                     # Stuurt VLAN-configuratiecommando's naar de switch.
        parents:                                                                                # Gaat eerst naar de juiste VLAN-configuratiemodus.
          - "vlan {{ item.id }}"
        lines:                                                                                  # Voert daarna de commando's binnen die VLAN-modus uit.
          - "name {{ item.name }}"
      loop: "{{ variables.switch.vlans }}"                                                       # Loopt door alle VLANs die in info.yml staan.

    # Zet de accesspoort eerst terug naar standaardconfiguratie.
    #
    # Dit vermijdt dat oude testconfiguratie blijft hangen.
    # Daarna bouwen we de gewenste accesspoort opnieuw proper op.
    - name: Accesspoort resetten
      cisco.ios.ios_config:                                                                     # Voert Cisco-configuratiecommando's uit.
        lines:
          - "default interface {{ variables.switch.access_port }}"                               # Zet de accesspoort terug naar standaardinstellingen.

    - name: Accesspoort configureren
      cisco.ios.ios_config:
        parents:                                                                                # Gaat eerst naar de accesspoort-interface.
          - "interface {{ variables.switch.access_port }}"
        lines:                                                                                  # Voert daarna de accesspoortcommando's binnen die interface uit.
          - "description {{ variables.switch.access_description }}"
          - switchport mode access
          - "switchport access vlan {{ variables.switch.access_vlan }}"
          - no shutdown

    # Zet de trunkpoort eerst terug naar standaardconfiguratie.
    #
    # Zo vermijden we dat oude accessconfiguratie of testregels
    # blijven staan op een poort die als trunk bedoeld is.
    - name: Trunkpoort resetten
      cisco.ios.ios_config:                                                                     # Voert Cisco-configuratiecommando's uit.
        lines:
          - "default interface {{ variables.switch.trunk_port }}"                                # Zet de trunkpoort terug naar standaardinstellingen.

    - name: Trunkpoort configureren
      cisco.ios.ios_config:
        parents:                                                                                # Gaat eerst naar de trunkpoort-interface.
          - "interface {{ variables.switch.trunk_port }}"
        lines:                                                                                  # Voert daarna de trunkcommando's binnen die interface uit.
          - "description {{ variables.switch.trunk_description }}"
          - switchport trunk encapsulation dot1q
          - switchport mode trunk
          - "switchport trunk allowed vlan {{ variables.switch.trunk_allowed_vlans }}"
          - no shutdown

    # Slaat de configuratie op als er iets gewijzigd is.
    # Zo blijft de configuratie behouden na een herstart van de switch.
    - name: Configuratie opslaan indien gewijzigd
      cisco.ios.ios_config:
        save_when: modified                                                                     # Slaat alleen op als Ansible effectief iets gewijzigd heeft.


###############################################################################
#                              Backup Configuratie                            #
###############################################################################

    - name: Backupmetadata voorbereiden
      ansible.builtin.set_fact:                                                                 # Maakt tijdelijke variabelen tijdens het uitvoeren van het playbook.
        backup_timestamp: "{{ lookup('pipe', 'TZ=Europe/Brussels date +%Y%m%d-%H%M%S') }}"       # lookup('pipe', ...) voert een lokaal commando uit in de Ansible-container en maakt een uniek tijdstip.
        backup_created_by: "{{ logged_user | default('unknown') }}"                              # We geven de naam van de ingelogde user mee. Als die ontbreekt, gebruiken we unknown.

    - name: Backupmapnaam voorbereiden
      ansible.builtin.set_fact:                                                                 # Maakt opnieuw een tijdelijke variabele.
        backup_run_reference: "{{ run_reference | default('run-' ~ backup_timestamp ~ '-' ~ backup_created_by ~ '-setup1') }}"   # Maakt de naam klaar van de backupmap die bij deze run hoort.

    - name: Backupmap voor deze run maken
      ansible.builtin.file:                                                                     # Maakt de backupmap aan als die nog niet bestaat.
        path: "/app/backups/{{ backup_run_reference }}"                                         # Zo kunnen we later in de geschiedenis exact de juiste backups tonen bij de juiste run.
        state: directory
      delegate_to: localhost                                                                    # Deze taak draait in de Flask/Ansible-container en niet op de switch.

    - name: Switch running-config ophalen voor backup
      cisco.ios.ios_command:                                                                    # Cisco-module waarmee Ansible show-commando's uitvoert.
        commands:
          - show running-config
      register: switch_backup_config                                                            # Bewaart de output van show running-config zodat we die later kunnen wegschrijven.

    # Bewaart de switchconfiguratie als tekstbestand in /app/backups.
    #
    # /app/backups is via Docker Compose gekoppeld aan de map backups/
    # op onze eigen pc. Daardoor blijft de backup zichtbaar buiten de container.
    #
    # De bestandsnaam bevat:
    # - het toestel uit de inventory;
    # - de gebruiker/docent als die later wordt meegegeven;
    # - de datum en tijd van de backup.
    - name: Switchconfiguratie bewaren in backups-map
      ansible.builtin.copy:                                                                     # Schrijft tekst weg naar een bestand.
        content: "{{ switch_backup_config.stdout[0] }}"                                         # Dit is de running-config die we hierboven opgehaald hebben.
        dest: "/app/backups/{{ backup_run_reference }}/{{ inventory_hostname }}-running-config.txt"   # /app/backups is via Docker Compose gekoppeld aan backups/ op onze pc.
      delegate_to: localhost                                                                    # Deze taak draait in de Flask/Ansible-container, want daar staat de backupmap.
