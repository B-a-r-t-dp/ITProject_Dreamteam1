# Ansible-inventory
# Verantwoordelijke: Bart
#
# Dit bestand zegt aan Ansible welke toestellen er bestaan in setup1
# en hoe Ansible later met die toestellen moet verbinden.

[routers]
r1 ansible_host=192.168.0.215

[switches]
sw1 ansible_host=192.168.0.216

[network_devices:children]                      # We stoppen routers en switches in 1 groep. Daardoor kunnen we de verbindingsinstellingen hieronder 1 keer zetten in plaats van apart bij elk toestel.
routers
switches

[network_devices:vars]
ansible_connection=network_cli                  # Ansible moet deze toestellen behandelen als netwerktoestellen, Daardoor gebruikt Ansible geen gewone Linux-SSH, maar Cisco CLI-commando's.
ansible_network_os=cisco.ios.ios                # Dit zegt aan Ansible dat het om Cisco IOS-toestellen gaat.
ansible_network_cli_ssh_type=paramiko           # We gebruiken Paramiko als SSH-methode. Dit werkte het beste met onze Cisco IOSv-toestellen in EVE-NG. Een alternatief is libssh, maar bij onze labo-opstelling was Paramiko eenvoudiger en stabieler.
ansible_user=admin                              # Gebruikersnaam waarmee Ansible inlogt op de router en switch.
ansible_password=azerty                         # Wachtwoord van de admin-gebruiker.
ansible_become=no                               # Ansible moet na het inloggen geen extra enable-stap doen, Onze admin-gebruiker heeft privilege 15 en krijgt dus meteen genoeg rechten.
ansible_command_timeout=120                     # Hoe lang Ansible mag wachten op een antwoord van een commando.
ansible_connect_timeout=60                      # Hoe lang Ansible mag proberen om verbinding te maken met het toestel.


# Sommige Cisco IOSv-images gebruiken oudere SSH-algoritmes.
# Moderne SSH-clients blokkeren die soms standaard.
# Daarom laten we deze oudere algoritmes bewust toe voor onze EVE-NG labo-opstelling.
#
# KexAlgorithms:
# bepaalt hoe de SSH-verbinding in het begin veilig wordt opgezet.
# We laten oude Diffie-Hellman-methodes toe omdat Cisco IOSv die nog gebruikt.
#
# HostKeyAlgorithms:
# bepaalt welk type sleutel van het Cisco-toestel aanvaard wordt.
# We laten ssh-rsa toe omdat oudere Cisco-images vaak zo'n RSA-hostkey gebruiken.
#
# PubkeyAcceptedAlgorithms:
# bepaalt welke publieke sleutel-algoritmes SSH mag gebruiken.
# Ook hier laten we ssh-rsa toe omdat dit beter werkt met oudere Cisco IOSv-images.
#
# In een echte productieomgeving zou je liever modernere SSH-algoritmes gebruiken.
ansible_ssh_common_args='-oKexAlgorithms=+diffie-hellman-group-exchange-sha1,diffie-hellman-group14-sha1 -oHostKeyAlgorithms=+ssh-rsa -oPubkeyAcceptedAlgorithms=+ssh-rsa'